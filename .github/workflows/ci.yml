# Build + tests on a GitHub Windows runner: no GPU and no game data, so the GPU tests skip
# (each prints "SKIPPED <test>: <reason>", counted at the end of scripts/test.ps1) and the
# tests on game data pass without running. What it checks on every push and pull request:
# the workspace builds, the unit / integration tests pass, and the recompiler's HLSL compiles
# with the runner's DXC (Windows SDK).
#
# Left out: the test title's end-to-end run (`test_title_runs_and_game_folder_is_untouched`).
# The runner has no System32\xgameruntime.dll (Gaming Services) and only the Microsoft Basic
# Render Driver (4-lane waves): the launcher warns about both, which that test treats as a
# failure. It still runs in `scripts/test.ps1` on a PC.
name: CI

on:
  push:
    branches: [main, 'nexusvi/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test (Windows, no GPU)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Test evidence parser
        shell: pwsh
        run: python -m unittest discover -s scripts -p test_nexusvi_test_summary.py -v

      - name: Build and test with evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Path target/nexusvi-evidence -Force | Out-Null
          pwsh -NoProfile -File ./scripts/test.ps1 --skip test_title_runs_and_game_folder_is_untouched --nocapture 2>&1 |
            Tee-Object -FilePath target/nexusvi-evidence/cargo.log
          $cargoExit = $LASTEXITCODE
          python scripts/nexusvi_test_summary.py target/nexusvi-evidence/cargo.log --exit-code $cargoExit --revision $env:GITHUB_SHA |
            Set-Content -Encoding utf8 target/nexusvi-evidence/summary.json
          $summaryExit = $LASTEXITCODE
          if ($cargoExit -ne 0) { exit $cargoExit }
          exit $summaryExit

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexusvi-test-evidence
          path: target/nexusvi-evidence/summary.json
          if-no-files-found: warn
          retention-days: 14
